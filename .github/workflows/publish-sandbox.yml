name: Publish SABER Sandbox

on:
  push:
    branches: ["main"]
    paths:
      - "docker/Dockerfile.sandbox"
      - "docker/**"
      - ".github/workflows/publish-sandbox.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: atharvkashyap/saber-sandbox

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sandbox
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:kali-last-release
            ghcr.io/${{ env.IMAGE_NAME }}:latest
