
name: Docker E2E

on:

  workflow_dispatch:

  pull_request:

    branches: ["**"]

permissions:

  contents: read

  packages: read

jobs:

  docker-e2e:

    name: Docker E2E on Linux

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.13"

      - name: Install package and test dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -e .

          python -m pip install pytest openpyxl jinja2 reportlab fastapi httpx uvicorn

      - name: Pull SABER sandbox image

        run: |

          docker pull ghcr.io/atharvkashyap/saber-sandbox:kali-last-release

      - name: Run Docker E2E tests

        env:

          SABER_RUN_DOCKER_E2E: "1"

          SABER_SANDBOX_IMAGE: ghcr.io/atharvkashyap/saber-sandbox:kali-last-release

        run: |

          pytest tests/e2e_tests -q --tb=short -x

