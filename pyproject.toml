[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saber"
version = "0.1.0"
description = "Scoped Automated Breach, Exploitation & Reporting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Atharv Kashyap" }
]
keywords = [
  "security",
  "penetration-testing",
  "security-automation",
  "vulnerability-assessment",
  "reporting"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

dependencies = [
  "anthropic>=0.28.0",
  "pydantic>=2.0.0",
  "aiosqlite>=0.19.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "aiohttp>=3.9.0",
  "click>=8.0",
  "rich>=13.0",
  "jinja2>=3.1.0",
  "docker>=7.0.0",
  "python-libnmap>=0.7.2",
  "pymetasploit3>=1.0.3",
  "python-gvm>=22.0.0",
  "python-owasp-zap-v2.4>=0.0.21",
  "cvss>=3.1",
  "impacket>=0.11.0",
  "networkx>=3.0",
  "reportlab>=4.0.0",
  "openpyxl>=3.1.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "pytest-mock>=3.11",
  "coverage>=7.0",
  "ruff>=0.1.0",
  "mypy>=1.0",
  "pre-commit>=3.0",
]

[project.scripts]
saber = "saber.ui.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["saber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: tests that require external tools, Docker, or lab targets",
  "ad_lab: tests that require an Active Directory lab environment",
]

[tool.coverage.run]
branch = true
source = ["saber"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["saber", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
plugins = []
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = [
  "build/",
  "dist/",
  "\\.venv/",
]