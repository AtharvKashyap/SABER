name: snmpwalk
display_name: SNMPWalk
category: network
phase: recon
image: saber/snmpwalk:latest
binary: snmpwalk
description: SNMP OID tree enumeration.
default_timeout_seconds: 300
requires_network: true

inputs:
  target:
    type: string
    required: true
  community:
    type: string
    required: false
    default: public
    sensitive: true
  oid:
    type: string
    required: false
    default: 1.3.6.1.2.1
  version:
    type: string
    required: false
    default: 2c

actions:
  walk:
    description: Run SNMP walk.
    command_template:
      - snmpwalk
      - -v
      - "{version}"
      - -c
      - "{community}"
      - "{target}"
      - "{oid}"
    evidence_dir: network/snmpwalk
    output_parsers:
      - snmpwalk

  system_info:
    description: Enumerate SNMP system information.
    command_template:
      - snmpwalk
      - -v
      - "{version}"
      - -c
      - "{community}"
      - "{target}"
      - 1.3.6.1.2.1.1
    evidence_dir: network/snmpwalk/system_info
    output_parsers:
      - snmpwalk
