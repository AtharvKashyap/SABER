name: impacket
display_name: Impacket
category: active_directory
phase: exploitation
image: saber/impacket:latest
binary: impacket
description: Impacket-based SMB, Kerberos, LDAP, and remote administration utilities.
default_timeout_seconds: 900
requires_network: true

inputs:
  target:
    type: string
    required: true
  domain:
    type: string
    required: false
  username:
    type: string
    required: false
  password:
    type: string
    required: false
    sensitive: true
  hashes:
    type: string
    required: false
    sensitive: true

actions:
  secretsdump:
    description: Dump credential material from an authorized Windows/AD target.
    requires_explicit_authorization: true
    command_template:
      - impacket-secretsdump
      - "{domain}/{username}:{password}@{target}"
    optional_flags:
      hashes:
        flag: -hashes
        style: separate
    evidence_dir: active_directory/impacket/secretsdump
    output_parsers:
      - impacket_secretsdump

  smbexec:
    description: Execute commands over SMB using Impacket.
    requires_explicit_authorization: true
    command_template:
      - impacket-smbexec
      - "{domain}/{username}:{password}@{target}"
    optional_flags:
      hashes:
        flag: -hashes
        style: separate
    evidence_dir: active_directory/impacket/smbexec
    output_parsers:
      - impacket

  wmiexec:
    description: Execute commands over WMI using Impacket.
    requires_explicit_authorization: true
    command_template:
      - impacket-wmiexec
      - "{domain}/{username}:{password}@{target}"
    optional_flags:
      hashes:
        flag: -hashes
        style: separate
    evidence_dir: active_directory/impacket/wmiexec
    output_parsers:
      - impacket
